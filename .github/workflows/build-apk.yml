name: Build debug APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run :core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Get build date
        id: build_date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Actions artifacts (above) aren't browsable from the GitHub mobile app. Publishing the
      # same APK to a Release gives a one-tap download link that works from the mobile app too.
      # Only runs on pushes to main (not PRs) so forks/PRs can't publish releases.
      - name: Publish debug APK to the "debug-latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "電池監控 — 最新 Debug 版本（${{ steps.build_date.outputs.date }}）"
          body: |
            自動從 main 分支編譯的最新 debug APK，可直接下載安裝測試用（非正式簽署版本）。
            建置日期：${{ steps.build_date.outputs.date }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
