org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Lets `./gradlew :core:test` configure only the :core module, skipping :app entirely.
# This matters in this dev sandbox specifically: :app declares the Android Gradle Plugin,
# which cannot be resolved here (Google's Maven repo is blocked by the outbound proxy), so
# without this flag even an unrelated :core task fails at :app's plugin-resolution step.
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
